name: Build Windows exe
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        working-directory: windows
        run: |
          mkdir -p web
          cp ../index.html ../manifest.webmanifest ../sw.js ../apple-touch-icon.png web/
          cp -r ../icons web/icons
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H=windowsgui" -o DWG-Viewer.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: DWG-Viewer-windows
          path: windows/DWG-Viewer.exe
